# Load balancer de la bodega WH-002 (Fase 5)
# Reparte los requests entre 3 instancias de la misma API
# y deja de mandar tráfico a la que no responda GET /health.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client  30s
    timeout server  30s

# DNS interno de Docker: permite encontrar las APIs por nombre
# aunque arranquen después que el balanceador.
resolvers docker
    nameserver dns1 127.0.0.11:53
    hold valid 5s

frontend wh002_entrada
    bind *:80
    default_backend wh002_apis

backend wh002_apis
    balance roundrobin                    # turnos: api1, api2, api3, api1...
    option httpchk GET /health            # health check activo
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
    # inter 2s: revisa cada 2 segundos
    # fall 2:   2 fallos seguidos -> la saca del reparto
    # rise 2:   2 éxitos seguidos -> la vuelve a meter
    server api1 wh002_api_1:8000 check
    server api2 wh002_api_2:8000 check
    server api3 wh002_api_3:8000 check
    # Cabecera para ver en cada respuesta qué instancia atendió
    http-response set-header X-Served-By %[srv_name]

# Panel de estado: http://localhost:8404
listen estadisticas
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
